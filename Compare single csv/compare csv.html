<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta CSV | Serverless</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .drop-zone {
            border: 2px dashed #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            position: relative;
            background: #fafafa;
        }

        .file-name {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
        }

        input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .key-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
        }

        .key-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-bottom: 24px;
            display: none;
        }

        .result-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .table-container {
            overflow-x: auto;
            max-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th,
        td {
            padding: 12px 20px;
            border-top: 1px solid #f1f5f9;
            text-align: left;
        }

        #loading {
            text-align: center;
            color: var(--primary);
            font-weight: 600;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>CSV Delta Engine</h1>
            <p>GitHub Pages Edition (Private & Serverless)</p>
        </div>

        <div id="loading">Initializing Python in Browser...</div>

        <div class="card" id="main-card" style="display: none;">
            <div id="step-1">
                <div class="file-grid">
                    <div class="drop-zone">
                        <i data-lucide="file-text"></i><br>
                        <strong>Base File (A)</strong>
                        <span class="file-name" id="name1">No file selected</span>
                        <input type="file" id="file1" accept=".csv" onchange="updateName(this, 'name1')">
                    </div>
                    <div class="drop-zone">
                        <i data-lucide="file-plus"></i><br>
                        <strong>New File (B)</strong>
                        <span class="file-name" id="name2">No file selected</span>
                        <input type="file" id="file2" accept=".csv" onchange="updateName(this, 'name2')">
                    </div>
                </div>
                <button onclick="analyzeStructure()">Analyze Structure</button>
            </div>

            <div id="step-2" style="display: none;">
                <strong>Select Key Variables:</strong>
                <div class="key-selector" id="key-box"></div>
                <button onclick="runComparison()">Find Differences</button>
            </div>
        </div>

        <div id="results-area">
            <div id="deleted-card" class="result-card">
                <div class="result-header">
                    <span style="color:var(--danger); font-weight:bold;">Removed Rows</span>
                    <button onclick="downloadCSV('deleted')" style="width:auto; padding:5px 10px;">Download</button>
                </div>
                <div class="table-container" id="deleted-table"></div>
            </div>
            <div id="added-card" class="result-card">
                <div class="result-header">
                    <span style="color:var(--success); font-weight:bold;">New Rows</span>
                    <button onclick="downloadCSV('added')" style="width:auto; padding:5px 10px;">Download</button>
                </div>
                <div class="table-container" id="added-table"></div>
            </div>
        </div>
    </div>

    <script>
        let pyodide;
        let df1_content, df2_content;

        async function initPyodide() {
            pyodide = await loadPyodide();
            await pyodide.loadPackage("pandas");
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-card').style.display = 'block';
            lucide.createIcons();
        }
        initPyodide();

        function updateName(input, id) {
            document.getElementById(id).innerText = input.files[0].name;
            const reader = new FileReader();
            reader.onload = (e) => {
                if (id === 'name1') df1_content = e.target.result;
                else df2_content = e.target.result;
            };
            reader.readAsText(input.files[0]);
        }

        async function analyzeStructure() {
            if (!df1_content || !df2_content) return alert("Select both files");

            pyodide.globals.set("csv1", df1_content);
            pyodide.globals.set("csv2", df2_content);

            const cols = await pyodide.runPythonAsync(`
                import pandas as pd
                import io
                df1 = pd.read_csv(io.StringIO(csv1)).dropna(how='all').fillna('').astype(str)
                df2 = pd.read_csv(io.StringIO(csv2)).dropna(how='all').fillna('').astype(str)
                common = list(set(df1.columns) & set(df2.columns))
                common
            `);

            const keyBox = document.getElementById('key-box');
            keyBox.innerHTML = cols.toJs().map(c => `
                <label class="key-item"><input type="checkbox" value="${c}" checked> ${c}</label>
            `).join('');

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
        }

        async function runComparison() {
            const keys = Array.from(document.querySelectorAll('#key-box input:checked')).map(i => i.value);
            pyodide.globals.set("selected_keys", pyodide.toPy(keys));

            const results = await pyodide.runPythonAsync(`
                merged = df1.merge(df2, on=selected_keys, how='outer', indicator=True)
                f1_only = merged[merged['_merge'] == 'left_only'].drop(columns=['_merge'])
                f2_only = merged[merged['_merge'] == 'right_only'].drop(columns=['_merge'])
                
                {
                    "deleted_html": f1_only.to_html(index=False),
                    "added_html": f2_only.to_html(index=False),
                    "deleted_csv": f1_only.to_csv(index=False),
                    "added_csv": f2_only.to_csv(index=False)
                }
            `);

            const resJs = results.toJs();
            window.csv_cache = resJs;

            document.getElementById('deleted-table').innerHTML = resJs.get('deleted_html');
            document.getElementById('added-table').innerHTML = resJs.get('added_html');
            document.getElementById('deleted-card').style.display = 'block';
            document.getElementById('added-card').style.display = 'block';
        }

        function downloadCSV(type) {
            const blob = new Blob([window.csv_cache.get(type + '_csv')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `delta_${type}.csv`;
            a.click();
        }
    </script>
</body>

</html>
